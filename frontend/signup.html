<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - Paakhi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-yellow-50/30">
    <main class="container mx-auto px-4 py-16">
      <div class="max-w-xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Create Account</h1>
        <form id="signup-form" class="space-y-4">
          <input type="text" id="first-name" placeholder="First Name" class="w-full p-2 border rounded" required />
          <input type="text" id="last-name" placeholder="Last Name" class="w-full p-2 border rounded" required />
          <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded" required />
          <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded" required />
          <button type="submit" class="bg-pink-600 text-white px-4 py-2 rounded">Sign Up</button>
        </form>
      </div>
    </main>
    <script src="js/signup.js"></script>
  </body>
</html>
