<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Paakhi Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap");
      body {
        font-family: "Poppins", sans-serif;
      }
      h1, .font-serif {
        font-family: "Cormorant Garamond", serif;
      }
    </style>
  </head>
  <body class="bg-yellow-50/30 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-lg p-8 max-w-xl w-full text-gray-800">
      <h1 class="text-3xl font-serif mb-6">My Profile</h1>
      <div class="space-y-4">
        <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
        <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
      </div>
      <button
        id="logout-btn"
        class="mt-6 w-full bg-pink-600 text-white py-3 font-semibold rounded-md hover:bg-pink-700 transition-colors"
      >
        LOGOUT
      </button>
    </div>

    <script src="profile.js"></script>
    <script src="logout.js"></script>
  </body>
</html>
